<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAP YOUR CRYPTO - Powered by Jupiter</title>
    
    <style>
        /* ================================================= */
        /* === 1. Глобальные CSS-переменные для Jupiter === */
        /* Установлена Темно-Зеленая Тема (Dark Theme) с высоким контрастом */
        /* ================================================= */
        :root {
            /* Основной фон виджета (Темно-зеленый) */
            --jupiter-plugin-background: 0, 70, 0; 
            /* Основной цвет акцента (Светло-зеленый для кнопок) */
            --jupiter-plugin-primary: 153, 255, 153; 
            /* Основной цвет текста (Белый) */
            --jupiter-plugin-primaryText: 255, 255, 255; 
            /* Цвет для предупреждений (Золотистый/Желтый) */
            --jupiter-plugin-warning: 255, 215, 0; 
            /* Фон полей ввода */
            --jupiter-plugin-interactive: 30, 80, 30; 
            /* Фон карточек/модулей */
            --jupiter-plugin-module: 15, 60, 15; 
        }
        
        /* === 2. Стили для вашей страницы === */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            /* Темный фон страницы */
            background-color: #222; 
            color: white; 
        }
        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #jupiter-swap-container {
            width: 420px; 
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            background-color: rgb(var(--jupiter-plugin-background));
        }
        .branding-note {
            margin-top: 20px;
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>SWAP YOUR CRYPTO</h1>
    
    <div id="jupiter-swap-container"></div>
    
    <p class="branding-note">
        Powered by Jupiter | Используется Jupiter Legacy API
    </p>

    <script src="https://terminal.jup.ag/main-v2.js" data-preload></script>

    <script>
        window.onload = function() {
            if (window.Jupiter) {
                console.log("Jupiter Plugin загружен и инициализирован.");

                window.Jupiter.init({
                    // Параметры режима
                    displayMode: "integrated",
                    integratedTargetId: "jupiter-swap-container", 
                    
                    // Настройка темы
                    theme: "dark", 
                    
                    // !!! ИСПРАВЛЕНИЕ RPC: Используем Helius для стабильности !!!
                    endpoint: "https://mainnet.helius-rpc.com/", 
                    
                    // ВАШИ НАСТРОЙКИ КОМИССИИ И РЕФЕРЕРА
                    platformFeeAndReferrer: {
                         platformFeeBps: 5, 
                         referrer: "7KmcLUUBpWGCbsi91hAfArLDiavF63c15kBDRwGzPLgd" 
                    },
                    
                    // Начальные токены
                    formProps: {
                         initialInputMint: "So11111111111111111111111111111111111111112", // SOL
                         initialOutputMint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" // USDC
                    },

                    // Обработчики событий
                    onSuccess: ({ txid }) => {
                        console.log(`Своп завершен! TX ID: ${txid}`);
                    },
                    onSwapError: ({ error }) => {
                        console.error("Ошибка при свопе:", error);
                    }
                });
                
            } else {
                console.error("Jupiter Plugin не загрузился!");
            }
        };
    </script>
    
</body>
</html>
